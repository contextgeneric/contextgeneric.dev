[package]
name = "cgp-website-example-code"
version = "0.0.0"
edition = "2021"
publish = false
description = "Compiled counterparts of the code shown on contextgeneric.dev. Not part of the site."

[dependencies]
# The `cgp` release the site documents, taken from the repository until it is on crates.io.
cgp = { git = "https://github.com/contextgeneric/cgp.git" }

[dev-dependencies]
anyhow = "1"
cap-std = "3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
trybuild = "1"

# The site documents the `cgp` release its sibling checkout prepares, which the repository's `main` does
# not hold yet. Remove this once that release is on `main`.
[patch."https://github.com/contextgeneric/cgp.git"]
cgp = { path = "../../cgp/crates/main/cgp" }
