[package]
name = "cgp-website-example-code"
version = "0.0.0"
edition = "2024"
publish = false
description = "Compiled counterparts of the code shown on contextgeneric.dev. Not part of the site."

[dependencies]
# The `cgp` release the site documents.
cgp = { version = "0.8.0", features = ["alloc"] }

[dev-dependencies]
anyhow = "1.0.104"
cap-std = "3.4.6"
cgp-error-anyhow = "0.8.0"
cgp-serde = "0.3.0"
cgp-serde-json = "0.3.0"
futures = "0.3.34"
hypershell = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread"] }
trybuild = "1.0.125"
typed-arena = "2.0.2"
