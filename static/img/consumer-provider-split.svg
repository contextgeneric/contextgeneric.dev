<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="title">One trait split into a consumer trait and a provider trait</title>
  <desc id="desc">A caller's trait such as CanFetchStorageObject becomes a consumer trait that callers use and a provider trait parameterized by the context, which two provider structs implement. A call through the consumer trait goes through the context's wiring, which selects the provider that answers it.</desc>
  <!-- Code and Rust items are set in the monospace stack, prose labels in the sans stack, as in the
       other shared diagrams. -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f1f1d"/>
    </marker>
  </defs>

  <rect x="250" y="10" width="380" height="52" rx="10" fill="#f7f0ea" stroke="#7d6b64" stroke-width="1.5"/>
  <text x="440" y="42" text-anchor="middle" font-size="16" font-weight="600" fill="#261d1b">one trait: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" font-size="15">CanFetchStorageObject</tspan></text>

  <!-- the split -->
  <path d="M 440 62 L 440 84" stroke="#8f1f1d" stroke-width="2"/>
  <path d="M 170 84 L 640 84" stroke="#8f1f1d" stroke-width="2"/>
  <path d="M 170 84 L 170 117" stroke="#8f1f1d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 640 84 L 640 117" stroke="#8f1f1d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- consumer side -->
  <rect x="30" y="120" width="280" height="96" rx="10" fill="#ffffff" stroke="#8f1f1d" stroke-width="1.5"/>
  <text x="170" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#8f1f1d">consumer trait</text>
  <text x="170" y="170" text-anchor="middle" font-size="13" fill="#261d1b">what callers use</text>
  <text x="170" y="195" text-anchor="middle" font-size="12" fill="#5e504c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">app.fetch_storage_object(id)</text>

  <!-- provider side -->
  <rect x="500" y="120" width="280" height="96" rx="10" fill="#ffffff" stroke="#8f1f1d" stroke-width="1.5"/>
  <text x="640" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#8f1f1d">provider trait</text>
  <text x="640" y="170" text-anchor="middle" font-size="13" fill="#261d1b">what implementations target</text>
  <text x="640" y="195" text-anchor="middle" font-size="12" fill="#5e504c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">StorageObjectFetcher&lt;Context&gt;</text>

  <!-- the two providers, labelled as the page declares them -->
  <path d="M 640 216 L 640 230" stroke="#8f1f1d" stroke-width="2"/>
  <path d="M 452 230 L 728 230" stroke="#8f1f1d" stroke-width="2"/>
  <path d="M 452 230 L 452 255" stroke="#8f1f1d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 728 230 L 728 255" stroke="#8f1f1d" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="320" y="258" width="264" height="84" rx="10" fill="#fdfaf7" stroke="#7d6b64"/>
    <text x="452" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#261d1b">FetchS3Object</text>
    <text x="452" y="308" text-anchor="middle" font-size="11" fill="#5e504c">impl StorageObjectFetcher&lt;Context&gt;</text>
    <text x="452" y="326" text-anchor="middle" font-size="11" fill="#5e504c">for FetchS3Object</text>

    <rect x="596" y="258" width="264" height="84" rx="10" fill="#fdfaf7" stroke="#7d6b64"/>
    <text x="728" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#261d1b">FetchLocalObject</text>
    <text x="728" y="308" text-anchor="middle" font-size="11" fill="#5e504c">impl StorageObjectFetcher&lt;Context&gt;</text>
    <text x="728" y="326" text-anchor="middle" font-size="11" fill="#5e504c">for FetchLocalObject</text>
  </g>

  <!-- the wiring's choice: a call through the consumer trait reaches the provider the wiring selects -->
  <path d="M 170 216 L 170 255" stroke="#8f1f1d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="258" width="200" height="84" rx="10" fill="#f7f0ea" stroke="#7d6b64" stroke-dasharray="5 3"/>
  <text x="170" y="292" text-anchor="middle" font-size="14" font-weight="600" fill="#261d1b">the context's wiring</text>
  <text x="170" y="316" text-anchor="middle" font-size="13" fill="#5e504c">selects one provider</text>
  <path d="M 272 300 L 316 300" stroke="#8f1f1d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
</svg>
